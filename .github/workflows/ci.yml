name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite (Unit & Integration)
        run: |
          cd backend
          python -m pytest tests --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  test-frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  docker-verify:
    name: Docker Compose Verification
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Compose Images
        run: |
          docker compose build

  deploy-dev:
    name: Continuous Deployment (Dev Environment)
    runs-on: ubuntu-latest
    needs: [ docker-verify ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: development
      url: https://dev.featurepulse.example.com

    steps:
      - name: Deploy to Dev
        run: |
          echo "Simulated Continuous Deployment to Dev Environment..."
          echo "Deployment successful for commit ${{ github.sha }}."

  deploy-production:
    name: Continuous Deployment (Production Gate)
    runs-on: ubuntu-latest
    needs: [ deploy-dev ]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://featurepulse.example.com

    steps:
      - name: Deploy to Production
        run: |
          echo "Production deployment gated by environment approval."
          echo "Released FeaturePulse production build: ${{ github.sha }}."
